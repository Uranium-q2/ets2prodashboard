<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ETS2 Super Dashboard</title>
<style>
    :root {
        --accent: #00e5ff;
        --danger: #ff3b3b;
        --warn: #ffb300;
        --ok: #3dff7a;
        --panel-bg: #12161c;
        --panel-border: #2c333d;
    }
    * { box-sizing: border-box; user-select: none; }
    html, body {
        background: radial-gradient(ellipse at center, #1a1d22 0%, #060708 100%);
        color: #fff;
        font-family: 'Segoe UI', Roboto, Helvetica, sans-serif;
        margin: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
    }
    .status-bar {
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 34px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 18px;
        font-size: 12px;
        letter-spacing: 1px;
        color: #8b95a5;
        background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent);
        z-index: 20;
    }
    #conn-dot {
        display: inline-block;
        width: 9px; height: 9px;
        border-radius: 50%;
        background: var(--danger);
        box-shadow: 0 0 8px var(--danger);
        margin-right: 6px;
        transition: all .3s;
    }
    #conn-dot.live { background: var(--ok); box-shadow: 0 0 10px var(--ok); }

    .cluster-housing {
        position: relative;
        width: 100vw; height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 2.2vw;
        flex-wrap: nowrap;
    }

    .gauge-column { display: flex; flex-direction: column; align-items: center; gap: 1.2vh; }

    /* ---- Warning light strip ---- */
    .warn-strip {
        position: absolute;
        bottom: 1.5vh;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 22px;
        background: rgba(10,12,15,0.7);
        padding: 8px 20px;
        border-radius: 10px;
        border: 1px solid var(--panel-border);
        z-index: 20;
    }
    .warn-light { font-size: 20px; color: #333842; transition: all .15s; filter: grayscale(1); opacity: .35; }
    .warn-light.on { opacity: 1; filter: none; text-shadow: 0 0 10px currentColor; }
    .w-park.on { color: var(--danger); }
    .w-engine.on { color: var(--ok); }
    .w-electric.on { color: var(--warn); }
    .w-lowbeam.on, .w-highbeam.on { color: var(--accent); }
    .w-hazard.on { color: var(--warn); animation: blink 0.6s infinite; }
    .w-wipers.on { color: var(--accent); }
    @keyframes blink { 50% { opacity: .2; } }

    /* ---- TFT computer ---- */
    .tft-display-cluster {
        position: relative;
        width: 250px;
        min-height: 380px;
        background: var(--panel-bg);
        border: 3px solid var(--panel-border);
        border-radius: 14px;
        box-shadow: 0 15px 40px rgba(0,0,0,0.9), inset 0 0 20px rgba(0,0,0,0.5);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        padding: 16px 14px;
        gap: 10px;
    }
    .tft-top {
        font-size: 11px; font-weight: 700; letter-spacing: 3px;
        color: #5b6577; text-transform: uppercase;
    }
    .tft-gear-container {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #1a1e24; border-radius: 8px; width: 100%; padding: 10px 0;
        box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
    }
    .tft-gear-label { font-size: 10px; color: #727d8d; letter-spacing: 1px; margin-bottom: 2px; }
    .tft-gear-value { font-size: 48px; font-weight: 700; color: #fff; line-height: 1; }

    .tft-info-box {
        width: 100%; background: #1a1e24; border-radius: 8px; padding: 8px 12px;
        display: flex; justify-content: space-between; align-items: center;
        font-size: 13px; color: #9aa4b2;
    }
    .tft-info-value { font-weight: 700; color: #fff; }
    .tft-info-value.active { color: var(--accent); }

    .job-panel {
        width: 100%; background: #171b21; border-radius: 8px; padding: 8px 10px;
        font-size: 11px; color: #8b95a5; display: none; flex-direction: column; gap: 3px;
    }
    .job-panel.show { display: flex; }
    .job-panel .row { display: flex; justify-content: space-between; }
    .job-panel .val { color: #fff; font-weight: 600; }
    .job-title { color: var(--accent); font-size: 10px; letter-spacing: 1px; margin-bottom: 2px; }

    /* ---- Blinkers (sit right above the central screen, like a real cluster) ---- */
    .blinker-row {
        display: flex; align-items: center; justify-content: center;
        gap: 48px; width: 100%; margin-top: -4px;
    }
    .blinker {
        font-size: 22px; color: #1a1a1a; transition: color .05s, text-shadow .05s;
        filter: drop-shadow(0 0 0 transparent);
    }
    .blinker.active { color: #00ff33; text-shadow: 0 0 14px #00ff33, 0 0 28px #00ff33; }

    /* ---- Big round gauges ---- */
    .gauge {
        position: relative; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        background: radial-gradient(circle at 50% 45%, #1b1f25 0%, #07080a 78%);
        box-shadow:
            0 20px 50px rgba(0,0,0,0.95),
            inset 0 0 0 7px #0c0d0f,
            inset 0 0 25px rgba(0,0,0,0.85);
        border: 5px solid #2e343d;
    }
    /* chrome bezel ring */
    .gauge::before {
        content: "";
        position: absolute; top: -5px; left: -5px; right: -5px; bottom: -5px;
        border-radius: 50%;
        background: conic-gradient(from 220deg,
            #8a95a3 0deg, #e8edf2 35deg, #5c6470 90deg, #aab3c0 150deg,
            #3b4049 210deg, #c3cad3 270deg, #6b7380 330deg, #8a95a3 360deg);
        z-index: -1;
        filter: brightness(0.85);
    }
    /* glass glare */
    .gauge::after {
        content: "";
        position: absolute; top: 4%; left: 10%; width: 55%; height: 40%;
        border-radius: 50%;
        background: linear-gradient(135deg, rgba(255,255,255,0.14) 0%, rgba(255,255,255,0.02) 55%, transparent 70%);
        pointer-events: none; z-index: 3;
    }
    .gauge-large { width: min(36vh, 400px); height: min(36vh, 400px); }
    .gauge-small { width: min(16vh, 170px); height: min(16vh, 170px); }

    .gauge svg.face { position: absolute; width: 100%; height: 100%; top: 0; left: 0; }
    .tick-label { fill: #c7cedb; font-size: 14px; font-weight: 600; font-family: 'Segoe UI', sans-serif; text-anchor: middle; }
    .gauge-caption { position: absolute; top: 27%; font-size: 12px; letter-spacing: 3px; color: #7986a0; font-weight: 600; }
    .gauge-unit { position: absolute; bottom: 28%; font-size: 11px; color: #45505f; }

    .needle-wrapper {
        position: absolute; width: 100%; height: 100%; top: 0; left: 0;
        transform: rotate(-130deg);
        transition: transform 0.04s cubic-bezier(0.2, 1.5, 0.4, 1);
        z-index: 6;
    }
    .needle {
        position: absolute; bottom: 50%; left: calc(50% - 2px); width: 4px;
        background: linear-gradient(to top, #8a0000 0%, #ff3030 55%, #ff8a8a 100%);
        border-radius: 3px 3px 0 0; box-shadow: 0 0 10px rgba(255, 40, 40, 0.95);
    }
    .needle::after {
        content: "";
        position: absolute; bottom: -9px; left: -5px; width: 14px; height: 14px;
        background: linear-gradient(to top, #8a0000, #ff3030);
        border-radius: 50%;
    }
    .needle-large { height: 36%; }
    .needle-small { height: 32%; }

    .pivot {
        position: absolute; width: 20px; height: 20px;
        background: radial-gradient(circle at 35% 30%, #ffffff 0%, #9aa3ad 35%, #2b2f36 100%);
        border-radius: 50%; z-index: 7;
        box-shadow: 0 3px 6px rgba(0,0,0,0.9), 0 0 0 3px #15171b;
    }

    .lcd-display {
        position: absolute; bottom: 18%; width: 100%; text-align: center;
        font-size: 28px; font-weight: bold; color: #00ffcc;
        text-shadow: 0 0 10px rgba(0,255,204,0.7); z-index: 4;
    }
    .lcd-sub { position: absolute; bottom: 10%; width: 100%; text-align: center; font-size: 11px; color: #4fa89c; z-index: 4; }

    .odo { font-size: 10px; color: #566072; letter-spacing: 1px; }
</style>
</head>
<body>

<div class="status-bar">
    <div><span id="conn-dot"></span><span id="conn-text">CONNECTING...</span></div>
    <div id="game-time">--:--</div>
</div>

<div class="cluster-housing">
    <!-- LEFT COLUMN: SPEED + FUEL -->
    <div class="gauge-column">
        <div class="gauge gauge-large" id="gauge-speed">
            <svg class="face" viewBox="0 0 400 400"></svg>
            <div class="gauge-caption">SPEED</div>
            <div class="needle-wrapper" id="speed-needle"><div class="needle needle-large"></div></div>
            <div class="pivot"></div>
            <div class="lcd-display" id="speed-text">0</div>
            <div class="lcd-sub">km/h</div>
        </div>

        <div class="gauge gauge-small" id="gauge-fuel">
            <svg class="face" viewBox="0 0 400 400"></svg>
            <div class="gauge-caption" style="font-size:10px;">FUEL</div>
            <div class="needle-wrapper" id="fuel-needle"><div class="needle needle-small"></div></div>
            <div class="pivot"></div>
            <div class="lcd-sub" id="fuel-text" style="bottom:22%;">0%</div>
        </div>
    </div>

    <!-- CENTRAL TFT COMPUTER DISPLAY -->
    <div class="tft-display-cluster">
        <div class="blinker-row">
            <div id="blinker-l" class="blinker">&#9668;</div>
            <div id="blinker-r" class="blinker">&#9658;</div>
        </div>
        <div class="tft-top">ON-BOARD COMPUTER</div>

        <div class="tft-gear-container">
            <div class="tft-gear-label">GEAR</div>
            <div class="tft-gear-value" id="gear-text">N</div>
        </div>

        <div class="tft-info-box">
            <span>CRUISE</span>
            <span id="cc-text" class="tft-info-value">OFF</span>
        </div>

        <div class="tft-info-box">
            <span>RANGE</span>
            <span id="range-text" class="tft-info-value">-- km</span>
        </div>

        <div class="tft-info-box">
            <span>ODOMETER</span>
            <span id="odo-text" class="tft-info-value">0 km</span>
        </div>

        <div class="job-panel" id="job-panel">
            <div class="job-title">ACTIVE JOB</div>
            <div class="row"><span>Cargo</span><span class="val" id="job-cargo">-</span></div>
            <div class="row"><span>To</span><span class="val" id="job-dest">-</span></div>
            <div class="row"><span>Distance</span><span class="val" id="job-dist">-</span></div>
            <div class="row"><span>Income</span><span class="val" id="job-income">-</span></div>
        </div>
    </div>

    <!-- RIGHT COLUMN: RPM + TEMP -->
    <div class="gauge-column">
        <div class="gauge gauge-large" id="gauge-rpm">
            <svg class="face" viewBox="0 0 400 400"></svg>
            <div class="gauge-caption">RPM</div>
            <div class="needle-wrapper" id="rpm-needle"><div class="needle needle-large"></div></div>
            <div class="pivot"></div>
            <div class="lcd-display" id="rpm-text">0</div>
            <div class="lcd-sub">x100 /min</div>
        </div>

        <div class="gauge gauge-small" id="gauge-temp">
            <svg class="face" viewBox="0 0 400 400"></svg>
            <div class="gauge-caption" style="font-size:10px;">TEMP</div>
            <div class="needle-wrapper" id="temp-needle"><div class="needle needle-small"></div></div>
            <div class="pivot"></div>
            <div class="lcd-sub" id="temp-text" style="bottom:22%;">0&deg;C</div>
        </div>
    </div>
</div>

<div class="warn-strip">
    <div class="warn-light w-park" id="w-park" title="Parking brake">&#9208;</div>
    <div class="warn-light w-engine" id="w-engine" title="Engine">&#9881;</div>
    <div class="warn-light w-electric" id="w-electric" title="Electric">&#9889;</div>
    <div class="warn-light w-lowbeam" id="w-lowbeam" title="Low beam">&#9728;</div>
    <div class="warn-light w-highbeam" id="w-highbeam" title="High beam">&#9733;</div>
    <div class="warn-light w-hazard" id="w-hazard" title="Hazard">&#9888;</div>
    <div class="warn-light w-wipers" id="w-wipers" title="Wipers">&#8776;</div>
</div>

<script>
function buildTicks(svg, ticks, startAngle, endAngle, redFrom, minorPerStep) {
    const ns = "http://www.w3.org/2000/svg";
    const cx = 200, cy = 200, r = 165;

    // outer rim + inner groove for a machined-metal look
    const rim = document.createElementNS(ns, "circle");
    rim.setAttribute("cx", cx); rim.setAttribute("cy", cy); rim.setAttribute("r", r + 6);
    rim.setAttribute("fill", "none"); rim.setAttribute("stroke", "#1c1f24"); rim.setAttribute("stroke-width", "2");
    svg.appendChild(rim);

    if (minorPerStep) {
        const totalMinor = (ticks.length - 1) * minorPerStep;
        for (let i = 0; i <= totalMinor; i++) {
            if (i % minorPerStep === 0) continue;
            const angle = startAngle + (i / totalMinor) * (endAngle - startAngle);
            const rad = angle * Math.PI / 180;
            const x1 = cx + (r - 10) * Math.cos(rad), y1 = cy + (r - 10) * Math.sin(rad);
            const x2 = cx + (r - 2) * Math.cos(rad), y2 = cy + (r - 2) * Math.sin(rad);
            const line = document.createElementNS(ns, "line");
            line.setAttribute("x1", x1); line.setAttribute("y1", y1);
            line.setAttribute("x2", x2); line.setAttribute("y2", y2);
            line.setAttribute("stroke", "#5c6472");
            line.setAttribute("stroke-width", "1.5");
            svg.appendChild(line);
        }
    }

    ticks.forEach((label, i) => {
        const angle = startAngle + (i / (ticks.length - 1)) * (endAngle - startAngle);
        const rad = angle * Math.PI / 180;
        const x1 = cx + (r - 20) * Math.cos(rad), y1 = cy + (r - 20) * Math.sin(rad);
        const x2 = cx + (r - 2) * Math.cos(rad), y2 = cy + (r - 2) * Math.sin(rad);
        const line = document.createElementNS(ns, "line");
        line.setAttribute("x1", x1); line.setAttribute("y1", y1);
        line.setAttribute("x2", x2); line.setAttribute("y2", y2);
        const isRed = redFrom !== undefined && i >= redFrom;
        line.setAttribute("stroke", isRed ? "#ff3333" : "#e4e8ee");
        line.setAttribute("stroke-width", "3.5");
        svg.appendChild(line);

        if (!label) return;
        const tx = cx + (r - 40) * Math.cos(rad), ty = cy + (r - 40) * Math.sin(rad);
        const text = document.createElementNS(ns, "text");
        text.setAttribute("x", tx); text.setAttribute("y", ty + 4);
        text.setAttribute("class", "tick-label");
        text.textContent = label;
        svg.appendChild(text);
    });
    if (redFrom !== undefined) {
        const redStart = startAngle + (redFrom / (ticks.length - 1)) * (endAngle - startAngle);
        const arc = document.createElementNS(ns, "path");
        const r2 = 165;
        const sx = cx + r2 * Math.cos(redStart * Math.PI/180), sy = cy + r2 * Math.sin(redStart * Math.PI/180);
        const ex = cx + r2 * Math.cos(endAngle * Math.PI/180), ey = cy + r2 * Math.sin(endAngle * Math.PI/180);
        const large = (endAngle - redStart) > 180 ? 1 : 0;
        arc.setAttribute("d", `M ${sx} ${sy} A ${r2} ${r2} 0 ${large} 1 ${ex} ${ey}`);
        arc.setAttribute("stroke", "#cc2222");
        arc.setAttribute("stroke-width", "6");
        arc.setAttribute("fill", "none");
        svg.appendChild(arc);
    }
}

buildTicks(document.querySelector('#gauge-speed svg'), [0,20,40,60,80,100,120,140], 140, 400, undefined, 4);
buildTicks(document.querySelector('#gauge-rpm svg'), [0,6,12,18,24,30], 140, 400, 4, 3);
buildTicks(document.querySelector('#gauge-fuel svg'), ['E','','1/2','','F'], 160, 380);
buildTicks(document.querySelector('#gauge-temp svg'), [40,60,80,100,120], 160, 380);

function fmtKm(n) { return n >= 1000 ? (n/1000).toFixed(1) + 'k km' : n + ' km'; }

function updateDashboard() {
    fetch('/data')
        .then(r => r.json())
        .then(data => {
            const connDot = document.getElementById('conn-dot');
            const connText = document.getElementById('conn-text');
            if (data.connected) {
                connDot.className = 'live';
                connText.innerText = 'TELEMETRY LIVE';
            } else {
                connDot.className = '';
                connText.innerText = 'NO SIGNAL';
            }
            document.getElementById('game-time').innerText = data.game_time || '--:--';

            let speed = data.speed;
            let speedAngle = -130 + (Math.min(speed, 140) / 140) * 260;
            document.getElementById('speed-needle').style.transform = `rotate(${speedAngle}deg)`;
            document.getElementById('speed-text').innerText = speed;

            let rpm = data.rpm;
            let rpmScaleVal = rpm / 100;
            let rpmAngle = -130 + (Math.min(rpmScaleVal, 30) / 30) * 260;
            document.getElementById('rpm-needle').style.transform = `rotate(${rpmAngle}deg)`;
            document.getElementById('rpm-text').innerText = rpm;

            let fuelPct = data.fuel_percent || 0;
            let fuelAngle = -110 + (Math.min(fuelPct, 100) / 100) * 220;
            document.getElementById('fuel-needle').style.transform = `rotate(${fuelAngle}deg)`;
            document.getElementById('fuel-text').innerText = fuelPct + '%';

            let temp = data.temp;
            let tempAngle = -110 + ((Math.min(Math.max(temp, 40), 120) - 40) / 80) * 220;
            document.getElementById('temp-needle').style.transform = `rotate(${tempAngle}deg)`;
            document.getElementById('temp-text').innerText = Math.round(temp) + '°C';

            document.getElementById('gear-text').innerText = data.connected ? data.gear : '-';

            let ccElement = document.getElementById('cc-text');
            if (data.cruise_on) {
                ccElement.innerText = data.cruise_speed + " km/h";
                ccElement.className = "tft-info-value active";
            } else {
                ccElement.innerText = "OFF";
                ccElement.className = "tft-info-value";
            }

            document.getElementById('range-text').innerText = data.fuel_range_km ? data.fuel_range_km + ' km' : '-- km';
            document.getElementById('odo-text').innerText = fmtKm(data.odometer || 0);

            document.getElementById('blinker-l').className = data.blinker_left ? "blinker active" : "blinker";
            document.getElementById('blinker-r').className = data.blinker_right ? "blinker active" : "blinker";

            const setWarn = (id, on) => document.getElementById(id).className = 'warn-light ' + id.replace('w-', 'w-') + (on ? ' on' : '');
            document.getElementById('w-park').className = 'warn-light w-park' + (data.parking_brake ? ' on' : '');
            document.getElementById('w-engine').className = 'warn-light w-engine' + (data.engine_on ? ' on' : '');
            document.getElementById('w-electric').className = 'warn-light w-electric' + (data.electric_on ? ' on' : '');
            document.getElementById('w-lowbeam').className = 'warn-light w-lowbeam' + (data.lights_low_beam ? ' on' : '');
            document.getElementById('w-highbeam').className = 'warn-light w-highbeam' + (data.lights_high_beam ? ' on' : '');
            document.getElementById('w-hazard').className = 'warn-light w-hazard' + (data.lights_hazard ? ' on' : '');
            document.getElementById('w-wipers').className = 'warn-light w-wipers' + (data.wipers ? ' on' : '');

            const jobPanel = document.getElementById('job-panel');
            if (data.job_active) {
                jobPanel.classList.add('show');
                document.getElementById('job-cargo').innerText = data.job_cargo || '-';
                document.getElementById('job-dest').innerText = data.job_destination || '-';
                document.getElementById('job-dist').innerText = data.job_distance_km ? data.job_distance_km + ' km' : '-';
                document.getElementById('job-income').innerText = data.job_income ? data.job_income + ' €' : '-';
            } else {
                jobPanel.classList.remove('show');
            }
        })
        .catch(() => {
            document.getElementById('conn-dot').className = '';
            document.getElementById('conn-text').innerText = 'NO SIGNAL';
        });
}

setInterval(updateDashboard, 100);
updateDashboard();
</script>
</body>
</html>
